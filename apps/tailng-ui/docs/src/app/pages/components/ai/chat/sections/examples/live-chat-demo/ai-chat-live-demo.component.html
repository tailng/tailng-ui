<tng-ai-chat

  assistantLabel="TailNG Assistant"
  subtitle="Local deterministic demo"
  protocolLabel="AG-UI 1.0"
  [messages]="messages()"
  [busy]="running()"
  [status]="statusMessage()"
  [canStop]="running()"
  [canRetry]="canRetry()"
