name: Ownable contract checks

on:
  pull_request:
    paths:
      - '.github/workflows/ownable-contracts.yml'
      - 'apps/tailng-ui/docs/**'
      - 'libs/tailng/cli/**'
      - 'libs/tailng-ui/registry/**'
      - 'tools/prerender/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ownable-contracts.yml'
      - 'apps/tailng-ui/docs/**'
      - 'libs/tailng/cli/**'
      - 'libs/tailng-ui/registry/**'
      - 'tools/prerender/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify registry, CLI, and ownable docs contracts
        run: pnpm run verify:ownable-contracts
