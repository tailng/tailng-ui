name: 'Test, Build, Release & Deploy'

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma list (remove what you don’t want): cdk,primitives,components,theme,icons,charts,flow'
        required: true
        default: 'cdk,primitives,components,theme,icons,charts,flow'
      release_type:
        description: 'patch: 2.1.0 -> 2.1.1 | minor: 2.1.0 -> 2.2.0 | major: 2.x -> 3.0.0'
        required: true
        type: choice
        options: [minor, major, patch]
      npm_tag:
        description: 'npm dist-tag'
        required: true
        default: 'latest'

# Each job receives only the permissions it needs.
permissions: {}

# Only one production release may calculate and push versions at a time.
concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      test_matrix: ${{ steps.tests.outputs.matrix }}
      has_tests: ${{ steps.tests.outputs.has_tests }}

    steps:
      - name: Ensure running on main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This workflow must be run from main branch"
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate inputs
        run: node tools/release/validate-inputs.mjs "${{ inputs.targets }}" "${{ inputs.release_type }}"

      - name: Resolve parallel test groups
        id: tests
        run: node tools/release/resolve-test-matrix.mjs "${{ inputs.targets }}"

  test:
    name: Test ${{ matrix.name }}
    needs: validate
    if: needs.validate.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix: ${{ fromJSON(needs.validate.outputs.test_matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Setup Node 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run selected package tests
        run: |
          node tools/release/run-if.mjs "${{ matrix.targets }}" cdk "pnpm run test:cdk"
          node tools/release/run-if.mjs "${{ matrix.targets }}" primitives "pnpm run test:primitives"
          node tools/release/run-if.mjs "${{ matrix.targets }}" components "pnpm run test:components"
          node tools/release/run-if.mjs "${{ matrix.targets }}" icons "pnpm run test:icons"
          node tools/release/run-if.mjs "${{ matrix.targets }}" charts "pnpm run test:charts"
          node tools/release/run-if.mjs "${{ matrix.targets }}" theme "pnpm run test:theme"
          node tools/release/run-if.mjs "${{ matrix.targets }}" flow "pnpm run test:flow"

  release:
    name: Build, publish, and release
    needs: [validate, test]
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        (needs.test.result == 'success' || needs.test.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      # Node 24 includes an npm version supported by npm Trusted Publishing.
      - name: Setup Node 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export TARGETS
        run: echo "TARGETS=,${{ inputs.targets }}," >> "$GITHUB_ENV"

      - name: Set Git user
        run: |
          git config --global user.email "prince.francis@tociva.com"
          git config --global user.name "Tociva Technologies"

      - name: Bump versions
        run: node tools/release/bump-versions.mjs \
          "${{ inputs.targets }}" \
          "${{ inputs.release_type }}"

      - name: Commit and push version changes
        run: |
          git add package.json libs/**/package.json || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore(release): ${{ inputs.release_type }} (${{ inputs.targets }}) [skip ci]"
          fi

          # main may advance while tests are running. Replay the release commit
          # on the latest remote tip instead of force-pushing over newer work.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Unable to push after ${attempt} attempts"
              exit 1
            fi

            echo "main advanced during push; retrying (${attempt}/3)"
          done

      # Keep publishable artifacts on the existing clean, uncached build path.
      - name: Build selected packages
        run: node tools/release/build-selected.mjs "${{ inputs.targets }}"

      - name: Verify build output
        run: node tools/release/verify-dist.mjs "${{ inputs.targets }}"

      - name: Sanity check built bundles
        run: node tools/release/assert-bundles.mjs "${{ inputs.targets }}"

      - name: npm pack dry-run (selected targets)
        run: node tools/release/npm-pack-dry-run.mjs "${{ inputs.targets }}"

      - name: Packed Angular consumer smoke test
        run: node tools/release/angular-package-smoke-test.mjs "${{ inputs.targets }}"

      - name: Publish selected packages
        run: node tools/release/publish-selected.mjs \
          "${{ inputs.targets }}" \
          "${{ inputs.npm_tag }}"

      - name: Tag release
        run: node tools/release/tag-release.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.ROOT_TAG }}
          name: Release ${{ env.ROOT_TAG }}
          body: |
            Release Details
            Version: ${{ env.ROOT_VERSION }}
            Release Type: ${{ inputs.release_type }}
            Targets: ${{ inputs.targets }}
            npm Tag: ${{ inputs.npm_tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
