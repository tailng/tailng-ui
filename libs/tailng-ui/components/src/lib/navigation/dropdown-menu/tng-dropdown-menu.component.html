<div class="tng-dropdown-menu">
  <button
    type="button"
    class="tng-dropdown-menu__trigger"
    [disabled]="disabled()"
    [attr.aria-expanded]="open()"
    [attr.aria-haspopup]="'menu'"
    (click)="toggleOpen()"
  >
    {{ label() }}
  </button>

  @if (rendered()) {
    <ul
      #panel
      role="menu"
      class="tng-dropdown-menu__panel"
      data-tng-overlay-motion
      data-side="bottom"
      [attr.data-presence]="presenceState()"
      [attr.aria-hidden]="open() ? null : 'true'"
      [attr.inert]="open() ? null : ''"
    >
      <ng-content />
    </ul>
  }
</div>
