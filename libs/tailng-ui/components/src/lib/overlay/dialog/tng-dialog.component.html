@if (rendered()) {
  <div
    #backdropRef
    class="tng-dialog-backdrop"
    [attr.data-presence]="presenceState()"
    [attr.aria-hidden]="open() ? null : 'true'"
    [attr.inert]="open() ? null : ''"
    (pointerdown)="onBackdropPointerDown($event)"
  >
    <section
      #panelRef
      [id]="panelId"
      role="dialog"
      aria-modal="true"
      class="tng-dialog-panel"
      [attr.data-presence]="presenceState()"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="description() ? descriptionId : null"
      [attr.aria-hidden]="open() ? null : 'true'"
      [attr.inert]="open() ? null : ''"
      tabindex="-1"
      (keydown)="onPanelKeydown($event)"
    >
      <header class="tng-dialog-header">
        <div class="tng-dialog-heading">
          <h2 [id]="titleId" class="tng-dialog-title">{{ title() }}</h2>
          @if (description()) {
            <p [id]="descriptionId" class="tng-dialog-description">{{ description() }}</p>
          }
        </div>

        <button
          type="button"
          class="tng-dialog-close"
          aria-label="Close dialog"
          (click)="onCloseButtonClick()"
        >
          ×
        </button>
      </header>

      <div class="tng-dialog-content" data-slot="dialog-content">
        <ng-content />
      </div>
    </section>
  </div>
}
