<div
  tngPopover
  #popoverRef="tngPopover"
  class="tng-popover-root"
  [open]="open()"
  [defaultOpen]="defaultOpen()"
  [disabled]="disabled()"
  [closeOnEscape]="closeOnEscape()"
  [closeOnFocusOutside]="closeOnFocusOutside()"
  [closeOnOutsidePointer]="closeOnOutsidePointer()"
  [restoreFocus]="restoreFocus()"
  [autoFocus]="autoFocus()"
  [side]="side()"
  [align]="align()"
  [panelRole]="panelRole()"
  [ariaLabel]="panelAriaLabel()"
  [ariaLabelledby]="panelAriaLabelledby()"
  [ariaHasPopup]="ariaHasPopup()"
  [scrollStrategy]="scrollStrategy()"
  (openChange)="onPrimitiveOpenChange($event)"
  (closed)="closed.emit($event)"
>
  <section #panelRef tngPopoverPanel class="tng-popover-panel">
    <ng-content />
  </section>
</div>
