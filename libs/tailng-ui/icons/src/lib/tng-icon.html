@if (hasSvg()) {
<span
  class="tng-icon__svg"
  [tngIconSvgDefinition]="svgDefinition()"
  [attr.aria-hidden]="iconAriaHidden()"
  [attr.aria-label]="iconAriaLabel()"
  [attr.role]="iconRole()"
></span>
} @else {
<span
  class="tng-icon__fallback"
  [attr.aria-hidden]="iconAriaHidden()"
  [attr.aria-label]="iconAriaLabel()"
  [attr.role]="iconRole()"
>
  ◻
</span>
}
